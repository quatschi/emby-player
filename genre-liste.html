<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genre-Liste</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #f0f0f0; max-width: 800px; margin: 0 auto; padding: 20px; }
    h1 { color: #1db954; margin-bottom: 6px; }
    .info { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
    .btn { background: #1db954; border: none; border-radius: 8px; color: #000; padding: 10px 20px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
    .btn:hover { background: #17a348; }
    #output { background: #111; border-radius: 10px; padding: 16px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; line-height: 1.8; max-height: 70vh; overflow-y: auto; }
    .count { color: #888; font-size: 0.85rem; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Emby Genre-Liste</h1>
  <p class="info">Alle Genres aus der Musikbibliothek, alphabetisch sortiert.</p>
  <button class="btn" onclick="kopieren()">📋 Alle kopieren</button>
  <div class="count" id="count"></div>
  <div id="output">Lädt…</div>

  <script>
    const SERVER  = 'http://192.168.178.49:8096';
    const API_KEY = '5be8c445d25a462aa7ce6ec56eca83ad';
    const USER_ID = 'd48278c658444024b15a952b03d51b7e';

    async function laden() {
      try {
        const url = `${SERVER}/MusicGenres?api_key=${API_KEY}&userId=${USER_ID}&Recursive=true&SortBy=SortName&SortOrder=Ascending&Limit=1000`;
        const r    = await fetch(url);
        const data = await r.json();
        const genres = (data.Items || []).map(g => g.Name);
        document.getElementById('count').textContent = `${genres.length} Genres gefunden`;
        document.getElementById('output').textContent = genres.join('\n');
      } catch(e) {
        document.getElementById('output').textContent = 'Fehler: ' + e.message;
      }
    }

    function kopieren() {
      const text = document.getElementById('output').textContent;
      navigator.clipboard.writeText(text).then(() => alert('Kopiert!'));
    }

    laden();
  </script>
</body>
</html>
