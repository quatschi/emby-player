<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100svh;
  color: white;
  padding: 30px 20px 40px;
}

/* ── Header ── */
h1 {
  text-align: center;
  font-size: 1.8rem;
  font-weight: 300;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  color: #e0d7ff;
}
.subtitle {
  text-align: center;
  font-size: 0.82rem;
  color: #9b8fc0;
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.settings-link {
  display: block;
  text-align: center;
  margin-bottom: 20px;
}
.settings-link button {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  color: #9b8fc0;
  padding: 5px 16px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}
.settings-link button:hover { background: rgba(255,255,255,0.12); color: #e0d7ff; }

/* ── Filter-Pills ── */
.filters {
  max-width: 600px;
  margin: 0 auto 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.filter-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  color: #9b8fc0;
  padding: 7px 18px;
  cursor: pointer;
  font-size: 0.82rem;
  font-family: inherit;
  letter-spacing: 0.03em;
  transition: all 0.2s;
  backdrop-filter: blur(10px);
}
.filter-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(180,150,255,0.35); color: #e0d7ff; }
.filter-btn.active {
  background: rgba(180,150,255,0.25);
  border-color: rgba(180,150,255,0.6);
  color: #e8e0ff;
  font-weight: 500;
}

/* ── Verbindungs-Overlay ── */
.conn-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,8,30,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}
.conn-box {
  background: #1a1535;
  border: 1px solid rgba(180,150,255,0.3);
  border-radius: 16px;
  padding: 28px;
  max-width: 440px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.conn-box h2 { font-size: 1.1rem; font-weight: 400; color: #e0d7ff; }
.field-label {
  font-size: 0.75rem;
  color: #9b8fc0;
  display: block;

(function init() {
  try { cfg = JSON.parse(localStorage.getItem('emby_cfg') || '{}'); } catch(e) {}
  if (cfg.serverUrl) $('inp-server').value = cfg.serverUrl;
  if (cfg.apiKey)    $('inp-key').value    = cfg.apiKey;
  addedDays  = parseInt(localStorage.getItem('emby_addeddays') || '0', 10);
  syncDatePresets();
  try { excludedGenres = new Set(JSON.parse(localStorage.getItem('emby_excl_genres') || '[]')); } catch(e) {}
  try { selectedGenres  = new Set(JSON.parse(localStorage.getItem('emby_sel_genres') || '[]')); } catch(e) {}
  try { ratingCache = JSON.parse(localStorage.getItem('emby_ratings') || '{}'); } catch(e) {}
  minRating = parseInt(localStorage.getItem('emby_minrating') || '0', 10);
  syncRatingPresets();
  renderServerButtons();
  if (cfg.userId) {
    $('subtitle-line').textContent = 'Verbinde…';
    api('/Users/' + cfg.userId).then(user => {
      $('subtitle-line').textContent = 'Verbunden als ' + (user.Name || cfg.userId);
      showPanel('filter');
      $('btn-load').style.display = '';
      loadGenres(); loadPlaylists(); renderExclChips();
    }).catch(() => {
      // Aktuelle URL nicht erreichbar → automatisch andere versuchen
      tryFallbackServer();
    });
  } else {
    $('subtitle-line').textContent = 'Nicht verbunden';
    connOverlay.style.display = 'flex';
  }
})();

function renderServerButtons() {
  const row = $('server-quick-row');
  if (!row) return;
  row.innerHTML = '';
  KNOWN_SERVERS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'btn-sec server-quick-btn' + (cfg.serverUrl === s.url ? ' active' : '');
    btn.textContent = s.label;
    btn.title = s.url;
    btn.addEventListener('click', () => {
      $('inp-server').value = s.url;
      document.querySelectorAll('.server-quick-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    row.appendChild(btn);
  });
}

async function tryFallbackServer() {
  const altUrl = KNOWN_SERVERS.find(s => s.url !== cfg.serverUrl)?.url;
  if (!altUrl || !cfg.apiKey || !cfg.userId) {
    $('subtitle-line').textContent = 'Nicht verbunden';
    connOverlay.style.display = 'flex';
    return;
  }
  const oldUrl = cfg.serverUrl;
  cfg.serverUrl = altUrl;
  try {
    const user = await api('/Users/' + cfg.userId);
    localStorage.setItem('emby_cfg', JSON.stringify(cfg));
    $('inp-server').value = altUrl;
    $('subtitle-line').textContent = 'Verbunden als ' + (user.Name || cfg.userId);
    showPanel('filter');
    $('btn-load').style.display = '';
    loadGenres(); loadPlaylists(); renderExclChips();
    renderServerButtons();
  } catch(e) {
    cfg.serverUrl = oldUrl;
    $('subtitle-line').textContent = 'Nicht verbunden';
    connOverlay.style.display = 'flex';
  }
}

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
function setStatus(el, msg, err=false) {
  el.textContent = msg; el.className = 'status' + (err ? ' err' : '');
}
async function api(path, params={}) {
  const url = new URL(cfg.serverUrl.replace(/\/$/,'') + path);
  url.searchParams.set('api_key', cfg.apiKey);
  Object.entries(params).forEach(([k,v]) => { if (v !== undefined && v !== '') url.searchParams.set(k, String(v)); });
  const r = await fetch(url.toString());
  if (!r.ok) throw new Error(`HTTP ${r.status} (${path})`);
  return r.json();
}
function streamUrl(id) { return `${cfg.serverUrl}/Audio/${id}/stream?api_key=${cfg.apiKey}&static=true`; }
function artUrl(id)    { return `${cfg.serverUrl}/Items/${id}/Images/Primary?api_key=${cfg.apiKey}&fillWidth=500&quality=85`; }
function formatArtist(track) {
  const raw = track.AlbumArtist || (track.AlbumArtists||[]).map(a=>a.Name).join('; ') || '–';
  return raw.split(';').map(s=>s.trim()).filter(Boolean).join(' · ');
}

}

let allFoundPlaylists = [];

function matchBewertung(rawName) {
  if (!rawName) return null;
  const clean = rawName.replace(/[\s ​‌‍﻿]+/g, ' ').trim().toLowerCase();
  let m = clean.match(/^bewertung\s*([1-5])$/);
  if (m) return parseInt(m[1]);
  m = clean.match(/^bewertung([1-5])$/);
  if (m) return parseInt(m[1]);
  if (clean.includes('bewertung')) {
    const digits = clean.match(/[1-5]/g);
    if (digits && digits.length === 1) return parseInt(digits[0]);
  }
  return null;
}

async function loadPlaylists() {
  ratingPlaylists = {};
  allFoundPlaylists = [];
  const sel = $('sel-playlist');
  sel.innerHTML = '<option value="">– Keine –</option>';
  if (!cfg.userId) return;

  const addPlaylist = (p) => {
    if (!p.Name) return;
    allFoundPlaylists.push(p.Name);
    const ratingNum = matchBewertung(p.Name);
    if (ratingNum !== null) { ratingPlaylists[ratingNum] = p.Id; return; }
    const o = document.createElement('option');
    o.value = p.Id; o.textContent = p.Name;
    sel.appendChild(o);
  };

  try {
    const views = await api(`/Users/${cfg.userId}/Views`);
    const plView = (views.Items||[]).find(v =>
      v.CollectionType === 'playlists' || v.Name === 'Playlists' || v.Name === 'Wiedergabelisten'
    );
    if (plView) {
      const data = await api(`/Users/${cfg.userId}/Items`, {
        ParentId: plView.Id, Recursive:'true',
        SortBy:'SortName', SortOrder:'Ascending', Limit:'300'
      });
      if (data.Items && data.Items.length) { data.Items.forEach(addPlaylist); updateRatingStatus(); return; }
    }
  } catch(e) {}

  try {
    const data = await api(`/Users/${cfg.userId}/Items`, {
      IncludeItemTypes:'Playlist', Recursive:'true',
      SortBy:'SortName', SortOrder:'Ascending', Limit:'300'
    });
    if (data.Items && data.Items.length) { data.Items.forEach(addPlaylist); updateRatingStatus(); return; }
  } catch(e) {}

  try {
    const data = await api(`/Items`, {
      IncludeItemTypes:'Playlist', Recursive:'true', Limit:'300',
      SortBy:'SortName', SortOrder:'Ascending'
    });
    (data.Items||[]).forEach(addPlaylist);
  } catch(e) {}

  updateRatingStatus();
}

function updateRatingStatus() {
  const found = Object.keys(ratingPlaylists).length;
  const el = $('rating-status');
  if (!el) return;
  if (found > 0) {
    el.textContent = `✓ ${found} Bewertungs-Playlists`;
    el.style.color = 'var(--accent)';
  } else {
    el.textContent = '⚠ Bewertungs-Playlists nicht gefunden';
    el.style.color = 'var(--red)';
  }
}

function loadGenres() {
  allGenres = [
    'Blues', 'Classical', 'Country/Folk', 'Funk', 'Fusion',

    'Reggae', 'Rock', 'Smooth Jazz', 'Soul', 'World Music'

  const sel = $('sel-genre');
  if (sel) {
    sel.innerHTML = '<option value="">Alle Genres</option>';
    allGenres.forEach(name => {
      const o = document.createElement('option');
      o.value = o.textContent = name;
      sel.appendChild(o);
    });
  }
}

function renderGenrePills() {
  const row = $('genre-filter-row');
  row.innerHTML = '';

  // Ausschluss-Modus-Schalter
  const exclBtn = document.createElement('button');
  exclBtn.className = 'filter-btn excl-toggle' + (exclMode ? ' excl-active' : '');
  exclBtn.textContent = exclMode ? '⊘ Ausschluss-Modus' : '⊘ Ausschluss';
  exclBtn.title = 'Umschalten: Genre-Klick schließt dieses Genre aus (rot)';
  exclBtn.addEventListener('click', () => {
    exclMode = !exclMode;
    renderGenrePills();
  });
  row.appendChild(exclBtn);

  // "Alle" Pill (aktiv wenn keine Auswahl und keine Ausschlüsse)
  const allBtn = document.createElement('button');
  const alleAktiv = selectedGenres.size === 0 && excludedGenres.size === 0;
  allBtn.className = 'filter-btn' + (alleAktiv ? ' active' : '');
  allBtn.textContent = 'Alle';
  allBtn.addEventListener('click', () => {
    selectedGenres.clear();
    excludedGenres.clear();
    localStorage.setItem('emby_sel_genres', '[]');
    saveExclGenres();
    renderGenrePills();
    renderExclChips();
  });
  row.appendChild(allBtn);

  // Genre-Pills
  allGenres.forEach(name => {
    const btn = document.createElement('button');
    const isSelected = selectedGenres.has(name);
    const isExcluded = excludedGenres.has(name);
    let cls = 'filter-btn';
    if (isSelected) cls += ' active';
    if (isExcluded) cls += ' excl';
    btn.className = cls;
    btn.textContent = name;
    btn.addEventListener('click', () => {
      if (exclMode) {
        // Ausschluss-Modus: Genre aus-/einschließen
        if (excludedGenres.has(name)) {
          excludedGenres.delete(name);
        } else {
          excludedGenres.add(name);
          selectedGenres.delete(name); // nicht gleichzeitig ein+ausschließen
        }
        saveExclGenres();
      } else {
        // Normal-Modus: Mehrfachauswahl
        if (selectedGenres.has(name)) {
          selectedGenres.delete(name);
        } else {
          selectedGenres.add(name);
          excludedGenres.delete(name); // nicht gleichzeitig
        }
        localStorage.setItem('emby_sel_genres', JSON.stringify([...selectedGenres]));
        saveExclGenres();
      }
      renderGenrePills();
      renderExclChips();
    });
    row.appendChild(btn);
  });
}

function renderArtistResults(items) {
  const box = $('artist-results');
  box.innerHTML = '';
  if (!items.length) { box.innerHTML = '<div class="artist-msg">Keine Treffer.</div>'; return; }
  items.forEach(a => {
    const row = document.createElement('div');
    row.className = 'artist-result-item';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = selectedArtists.has(a.Id);
    const toggle = () => {
      if (selectedArtists.has(a.Id)) selectedArtists.delete(a.Id);
      else selectedArtists.set(a.Id, a.Name);
      cb.checked = selectedArtists.has(a.Id); renderArtistChips();
    };
    row.addEventListener('touchstart', e => { e.preventDefault(); toggle(); }, { passive:false });
    row.addEventListener('click', toggle);
    const label = document.createElement('span'); label.textContent = a.Name;
    row.appendChild(cb); row.appendChild(label); box.appendChild(row);
  });
}
function renderArtistChips() {
  const box = $('artist-chips'); box.innerHTML = '';
  selectedArtists.forEach((name, id) => {
    const chip = document.createElement('div'); chip.className='chip';
    chip.innerHTML = `<span>${name}</span><button class="chip-remove">×</button>`;
    chip.querySelector('.chip-remove').addEventListener('click', () => {
      selectedArtists.delete(id); renderArtistChips();

}

async function fetchPool() {
  const playlistId = $('sel-playlist').value;
  let items = [];

  if (!playlistId && minRating > 0) {
    const qualifiedIds = Object.entries(ratingCache)
      .filter(([,r]) => r >= minRating).map(([id]) => id);
    if (!qualifiedIds.length) throw new Error(`Keine bewerteten Titel mit ≥ ${minRating} Stern(en).`);
    const shuffledIds = qualifiedIds.sort(() => Math.random()-0.5).slice(0, POOL_SIZE);
    for (let i = 0; i < shuffledIds.length; i += 50) {
      const batch = shuffledIds.slice(i, i+50);
      try {
        const d = await api(`/Users/${cfg.userId}/Items`, {
          Ids: batch.join(','), Fields:'RunTimeTicks,AlbumArtist,AlbumArtists,Album'
        });
        items.push(...(d.Items||[]));
      } catch(e) {}
    }
    for (let i = items.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    if (!items.length) throw new Error('Titel konnten nicht geladen werden.');
    pool.push(...items);
    poolBadge.textContent=`${pool.length} im Pool`; poolBadge.style.display='';
    renderPoolList(); return;
  }

  if (playlistId) {
    const data = await api(`/Playlists/${playlistId}/Items`, {
      userId: cfg.userId, Fields:'RunTimeTicks,AlbumArtist,AlbumArtists,Album'
    });
    items = data.Items || [];
    for (let i = items.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    items = items.slice(0, POOL_SIZE);
  } else {
    const params = {
      IncludeItemTypes:'Audio', Recursive:'true', SortBy:'Random',
      Limit: POOL_SIZE * 3,
      Fields:'RunTimeTicks,AlbumArtist,AlbumArtists,Album'
    };
    if (cfg.musicLibraryId) params.ParentId = cfg.musicLibraryId;

    // Mehrfach-Genre-Auswahl: kommagetrennt → Emby-ODER-Logik
    const genreFromPills = [...selectedGenres].join(',');
    const genreFromSelect = $('sel-genre') ? $('sel-genre').value : '';
    const genre = genreFromPills || genreFromSelect;
    if (genre) params.Genres = genre;

    if (selectedArtists.size > 0) params.AlbumArtistIds = Array.from(selectedArtists.keys()).join(',');
    const yf=$('inp-year-from').value, yt=$('inp-year-to').value;
    if (yf) params.MinPremiereDate = `${yf}-01-01`;
    if (yt) params.MaxPremiereDate = `${yt}-12-31`;
    if (addedDays>0) params.MinDateLastSaved = new Date(Date.now()-addedDays*86400000).toISOString();

    const baseExclude = ['Hörbuch','Audiobook','Hörspiel','Podcast'];
    const userExclude = [...excludedGenres].filter(g => !baseExclude.includes(g));
    params.ExcludeGenres = [...baseExclude, ...userExclude].join(',');

    const data = await api(`/Users/${cfg.userId}/Items`, params);
    let candidates = data.Items || [];
    for (let i = candidates.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    const albumSeen = {}; const artistCount = {};
    for (const t of candidates) {
      const album  = t.Album || ('__' + t.Id);
      const artist = t.AlbumArtist || '__unbekannt__';
      if (!albumSeen[album] && (artistCount[artist]||0) < 3) {
        items.push(t);
        albumSeen[album] = true;
        artistCount[artist] = (artistCount[artist]||0) + 1;
      }
      if (items.length >= POOL_SIZE) break;
    }
  }

  if (!items.length) throw new Error('Keine Titel für diese Filter gefunden.');
  pool.push(...items);
  poolBadge.textContent=`${pool.length} im Pool`; poolBadge.style.display='';
  renderPoolList();
}

// ── WIEDERGABE ────────────────────────────────────────────
function startNext() {
  if (!pool.length) { setStatus(playerStatus,'Pool leer – bitte neu laden.'); return; }
  if (pool.length < REFILL_BELOW) fetchPool().catch(e => console.warn('Refill:',e.message));
  const track = pool.shift();
  if (current) history.push(current);
  current = track;
  btnPrev.disabled = !history.length;
  poolBadge.textContent = `${pool.length} im Pool`;
  audio.src = streamUrl(track.Id);
  audio.volume = 1;
  audio.play().catch(e => setStatus(playerStatus,`Wiedergabefehler: ${e.message}`,true));
  playing = true; btnPlay.textContent = '⏸';
  renderTrack(track); startProgress(track); pushMediaSession(track);
  showRating(track.Id); renderPoolList();
}

function renderTrack(track) {
  $('track-title').textContent  = track.Name || '–';
  $('track-artist').textContent = formatArtist(track);
  $('track-album').textContent  = track.Album || '';
  const wrap = $('art-wrap');
  const img  = new Image();
  img.onload  = () => { wrap.innerHTML=''; wrap.appendChild(img); img.style.cssText='width:100%;height:100%;object-fit:cover'; };
  img.onerror = () => { wrap.innerHTML='🎵'; };
  img.src = artUrl(track.Id);
}

function startProgress(track) {
  clearInterval(progTimer);
  const durSec = track.RunTimeTicks ? track.RunTimeTicks/1e7 : 0;
  $('time-tot').textContent = fmt(durSec);
  $('prog-limit').style.display = 'none';
  progTimer = setInterval(() => {
    const cur=audio.currentTime, total=durSec||audio.duration||1;
    $('prog-bar').style.width=`${Math.min((cur/total)*100,100)}%`;
    $('time-cur').textContent=fmt(cur);
  }, 500);
}

audio.addEventListener('ended', () => transitionTo());

function transitionTo() {
  if (!pool.length) {
    fetchPool().then(startNext).catch(e => setStatus(playerStatus,`Kein Nachschub: ${e.message}`,true));
    return;
  }
  startNext();
}

// ── STEUERUNG ─────────────────────────────────────────────
function pausePlay() {
  clearInterval(progTimer);
  audio.onended = null; audio.pause();
  playing=false; btnPlay.textContent='▶';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState='paused';
}
function resumePlay() {
  audio.play().catch(e => console.warn(e));
  playing=true; btnPlay.textContent='⏸';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState='playing';
}

btnPlay.addEventListener('click', () => { if (playing) pausePlay(); else resumePlay(); });
btnNext.addEventListener('click', () => { transitioning=false; transitionTo(); });
btnPrev.addEventListener('click', () => {
  if (!history.length) return;
  clearInterval(progTimer);
  transitioning=false; audio.onended=null; audio.pause();
  if (current) pool.unshift(current);
  const prev = history.pop(); current=prev;
  audio.src = streamUrl(prev.Id); audio.volume = 1;
  audio.play().catch(e => console.warn(e));
  playing=true; btnPlay.textContent='⏸';
  renderTrack(prev); startProgress(prev); pushMediaSession(prev);
  btnPrev.disabled=!history.length;
  poolBadge.textContent=`${pool.length} im Pool`;
  showRating(prev.Id);
});

// ── SESSION ALS PLAYLIST SPEICHERN ───────────────────────
$('btn-save-playlist').addEventListener('click', async () => {
  const gespielt = [...history, current].filter(Boolean);
  if (gespielt.length < 2) { alert('Noch zu wenige Titel gespielt.'); return; }
  const name = prompt('Name der neuen Playlist:', `Session ${new Date().toLocaleDateString('de-DE')}`);
  if (!name) return;
  const btn = $('btn-save-playlist');
  btn.disabled = true; btn.textContent = 'Speichert…';
  try {
    const createRes = await fetch(`${cfg.serverUrl}/Playlists?api_key=${cfg.apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ Name: name, UserId: cfg.userId, MediaType: 'Audio', Ids: gespielt.map(t=>t.Id) })
    });
    if (!createRes.ok) throw new Error(`HTTP ${createRes.status}`);
    btn.textContent = '✓ Gespeichert!';
    setTimeout(() => { btn.disabled=false; btn.textContent='💾 Session als Playlist speichern'; }, 2000);
    loadPlaylists();
  } catch(e) {
    alert(`Fehler: ${e.message}`);
    btn.disabled=false; btn.textContent='💾 Session als Playlist speichern';
  }
});

// ── STERNBEWERTUNG ────────────────────────────────────────
document.querySelectorAll('#rating-presets .preset').forEach(btn => {
  btn.addEventListener('click', () => {
    minRating = parseInt(btn.dataset.minrating, 10);
    localStorage.setItem('emby_minrating', minRating);
    syncRatingPresets();
  });
});
function syncRatingPresets() {
  document.querySelectorAll('#rating-presets .preset').forEach(btn =>
    btn.classList.toggle('active', parseInt(btn.dataset.minrating,10) === minRating));
}

function showRating(trackId) {
  const r = ratingCache[trackId] || 0;
  document.querySelectorAll('.star-btn').forEach(btn => {
    const lit = parseInt(btn.dataset.s) <= r;
    btn.classList.toggle('lit', lit);
    btn.textContent = lit ? '★' : '☆';
  });
  const hint = $('star-hint');
  if (hint) hint.textContent = r ? `Bewertet mit ${r} Stern${r>1?'en':''}` : '';
}

$('btn-rating-clear') && $('btn-rating-clear').addEventListener('click', () => {
  const id = current?.Id;
  if (!id) return;
  const prev = ratingCache[id];
  if (prev) {
    delete ratingCache[id];
    localStorage.setItem('emby_ratings', JSON.stringify(ratingCache));
    if (ratingPlaylists[prev]) removeFromRatingPlaylist(id, ratingPlaylists[prev]).catch(()=>{});
  }
  showRating(id);
});

document.querySelectorAll('.star-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!current) return;
    const stars = parseInt(btn.dataset.s);
    const trackId = current.Id;
    const prev = ratingCache[trackId] || 0;
    if (prev === stars) {
      delete ratingCache[trackId];
      localStorage.setItem('emby_ratings', JSON.stringify(ratingCache));
      showRating(trackId);
      if (prev && ratingPlaylists[prev]) removeFromRatingPlaylist(trackId, ratingPlaylists[prev]);
      return;
    }
    if (prev && ratingPlaylists[prev]) removeFromRatingPlaylist(trackId, ratingPlaylists[prev]);
    ratingCache[trackId] = stars;
    localStorage.setItem('emby_ratings', JSON.stringify(ratingCache));
    showRating(trackId);
    const hint = $('star-hint');
    if (hint) hint.textContent = `${stars} Stern${stars>1?'e':''} – wird gespeichert…`;
    addToRatingPlaylist(trackId, stars).then(() => {
      if (hint) hint.textContent = `✓ ${stars} Stern${stars>1?'e':''} – gespeichert`;
    }).catch(err => {
      if (hint) hint.textContent = `⚠ Lokal gespeichert – ${err.message}`;
    });
  });
});

async function addToRatingPlaylist(trackId, stars) {
  let pid = ratingPlaylists[stars];
  if (!pid) {
    const resp = await fetch(`${cfg.serverUrl}/Playlists`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Emby-Authorization': `MediaBrowser Client="EmbyPlayer", Token="${cfg.apiKey}"` },
      body: JSON.stringify({ Name: `Bewertung ${stars}`, Ids: [trackId], UserId: cfg.userId, MediaType: 'Audio' })
    });
    if (!resp.ok) throw new Error(`Playlist-Fehler HTTP ${resp.status}`);
    const result = await resp.json();
    pid = result.Id || result.PlaylistId;
    if (!pid) throw new Error('Playlist-ID fehlt');
    ratingPlaylists[stars] = pid;
    updateRatingStatus();
    return;
  }
  const url = `${cfg.serverUrl}/Playlists/${pid}/Items?ids=${trackId}&userId=${cfg.userId}&api_key=${cfg.apiKey}`;
  const r = await fetch(url, { method:'POST' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
}

async function removeFromRatingPlaylist(trackId, playlistId) {
  try {
    const data = await api(`/Playlists/${playlistId}/Items`, { userId: cfg.userId });
    const item = (data.Items||[]).find(i => i.Id === trackId);
    if (item && item.PlaylistItemId) {
      await fetch(`${cfg.serverUrl}/Playlists/${playlistId}/Items?EntryIds=${item.PlaylistItemId}&api_key=${cfg.apiKey}`, { method:'DELETE' });
    }
  } catch(e) {}
}

// ── POOL-LISTE ────────────────────────────────────────────
$('pool-hdr').addEventListener('click', () => {
  const open = $('pool-section').classList.toggle('open');
  $('pool-hdr').classList.toggle('open', open);
});

function renderPoolList() {
  const el = $('pool-list');
  if (!pool.length) { el.innerHTML = '<div style="color:var(--dim);padding:4px">Pool leer</div>'; return; }
  el.innerHTML = '';
  pool.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'pool-entry';
    const artist = t.AlbumArtist || (t.AlbumArtists||[]).map(a=>a.Name).join(', ') || '–';
    row.innerHTML = `<span class="pool-num">${i+1}.</span><span class="pool-title">${t.Name||'–'}</span><span class="pool-artist">${artist}</span>`;
    el.appendChild(row);
  });
}

// ── MEDIA SESSION ─────────────────────────────────────────
function pushMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title:track.Name||'', artist:formatArtist(track), album:track.Album||'',
    artwork:[{ src:artUrl(track.Id), sizes:'512x512', type:'image/jpeg' }]
  });
  navigator.mediaSession.playbackState='playing';
  navigator.mediaSession.setActionHandler('play',          ()=>resumePlay());
  navigator.mediaSession.setActionHandler('pause',         ()=>pausePlay());
  navigator.mediaSession.setActionHandler('nexttrack',     ()=>btnNext.click());
  navigator.mediaSession.setActionHandler('previoustrack', ()=>btnPrev.click());
}
</script>
